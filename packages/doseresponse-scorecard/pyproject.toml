[project]
name = "doseresponse-scorecard"
version = "0.0.1"
description = "Domain-neutral dose-response threshold estimation: GLM/log-logistic fits, ED_p extraction, Fieller ratio intervals, and a portable score-card schema"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Babak B" }]
keywords = ["dose-response", "threshold", "ED50", "Fieller", "probit"]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "lifelines>=0.29",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doseresponse_scorecard"]
